<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#15171c" />
  <title>ボドゲ一覧</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#181b22;
      --panel2:#20242d;
      --text:#f5f7fb;
      --sub:#aeb7c6;
      --line:#2d3340;
      --accent:#f2c14e;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:
      system-ui,-apple-system,"Segoe UI","Noto Sans JP","Yu Gothic UI","Yu Gothic",sans-serif}
    body{
      background:
        radial-gradient(circle at 20% -10%, rgba(242,193,78,.12), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(82,116,255,.10), transparent 30rem),
        var(--bg);
    }
    .wrap{width:min(1120px,100%);margin:0 auto;padding:28px 18px 48px}
    header{
      display:flex;align-items:end;justify-content:space-between;gap:18px;
      margin-bottom:24px
    }
    h1{margin:0;font-size:clamp(30px,5vw,52px);line-height:1;font-weight:900;letter-spacing:.02em}
    .count{color:var(--sub);font-size:14px;white-space:nowrap}
    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px
    }
    .game{
      position:relative;display:flex;flex-direction:column;justify-content:space-between;
      min-height:190px;padding:22px;border:1px solid var(--line);border-radius:20px;
      background:linear-gradient(145deg,var(--panel2),var(--panel));
      text-decoration:none;color:var(--text);box-shadow:var(--shadow);
      overflow:hidden;transition:transform .16s ease,border-color .16s ease,background .16s ease
    }
    .game::after{
      content:"";position:absolute;right:-45px;bottom:-55px;width:145px;height:145px;
      border-radius:50%;background:rgba(242,193,78,.07);pointer-events:none
    }
    .game:hover{transform:translateY(-4px);border-color:#6b6040}
    .game:active{transform:scale(.985)}
    .tag{
      width:max-content;padding:5px 9px;border-radius:999px;
      font-size:12px;font-weight:800;color:#171717;background:var(--accent)
    }
    .title{font-size:clamp(21px,2.2vw,29px);font-weight:900;line-height:1.25;margin-top:18px}
    .open{margin-top:22px;color:var(--sub);font-size:13px;font-weight:700}
    footer{margin-top:26px;color:#788191;font-size:12px;text-align:center}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:520px){
      .wrap{padding:22px 14px 34px}
      header{align-items:start;flex-direction:column;gap:8px}
      .grid{grid-template-columns:1fr;gap:12px}
      .game{min-height:145px;border-radius:17px;padding:19px}
      .title{font-size:24px}
      .open{margin-top:16px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>ボドゲ一覧</h1>
      <div class="count">11 GAME</div>
    </header>

    <section class="grid">
